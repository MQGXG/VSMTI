appId: com.mira.app
productName: Mira
copyright: Copyright © 2024

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - dist/**/*
  - "!node_modules/**/*"

# tree-sitter 等 WASM 文件 unpack 到 app.asar.unpacked，供 sidecar（纯 Node 子进程）读取
asarUnpack:
  - "**/*.wasm"

# 本地 AI 模型（Transformers.js ONNX）随应用分发，缺失时运行时自动在线下载
extraResources:
  - from: resources/models
    to: models
    filter:
      - "**/*"
  # 应用图标（托盘/窗口运行时使用）
  - from: resources/icon.png
    to: icon.png

win:
  icon: resources/icon.ico
  target:
    - target: portable
      arch: [x64]
  artifactName: "${productName}-${version}-portable.${ext}"

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: "${productName}-${version}.${ext}"

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64]
  artifactName: "${productName}-${version}.${ext}"
